spring:
  application:
    name: dropick-api

  # H2 In-Memory DB (Railway 호환)
  datasource:
    url: jdbc:h2:mem:dropick;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: ${PORT:8080}

jwt:
  secret: dropickSecretKey2026SuperSecureStringBase64StringForDevelopmentOnlyNeedAtLeast256Bits1234567890
  expiration: 86400000

---
# AWS 배포 시 MySQL 설정 (spring.profiles.active=prod)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:dropick}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
